<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Video Saver</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  width:90%;
  max-width:520px;
  background:#111827;
  padding:25px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.logo{
  width:60px;
  height:60px;
  border-radius:50%;
}

input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:15px;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#22c55e);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#msg{
  margin-top:15px;
}

.thumb{
  width:100%;
  border-radius:12px;
  margin-top:15px;
}

.qbtn{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#374151;
  color:white;
  cursor:pointer;
}

.qbtn:hover{
  background:#4b5563;
}

.bad{color:#ef4444;}
.good{color:#22c55e;}

.progress{
  width:100%;
  background:#333;
  border-radius:10px;
  margin-top:10px;
}

.bar{
  height:8px;
  width:0%;
  background:lime;
  border-radius:10px;
}

</style>

</head>

<body>

<div class="card">

  <img class="logo" src="https://i.imgur.com/8Km9tLL.png">

  <h1>My Video Saver</h1>

  <input id="url" placeholder="Paste Instagram / YouTube / Pinterest link">

  <button onclick="getVideo()">Fetch Video</button>

  <div id="msg"></div>

</div>

<script>

function progressBar(msg){

  let p = 0;

  msg.innerHTML = `
    ⏳ Processing... ${p}%
    <div class="progress"><div class="bar" id="bar"></div></div>
  `;

  const interval = setInterval(() => {
    p += 10;

    document.getElementById("bar").style.width = p + "%";

    if(p >= 100) clearInterval(interval);

  }, 150);

}

async function getVideo(){

  const url = document.getElementById("url").value;
  const msg = document.getElementById("msg");

  if(!url){
    msg.innerText = "❌ Enter URL";
    return;
  }

  progressBar(msg);

  try{

    const res = await fetch("https://fast-video-backend.onrender.com/download",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if(!data.success){
      msg.innerText = "❌ " + data.error;
      return;
    }

    let html = "";

    if(data.thumbnail){
      html += `<img class="thumb" src="${data.thumbnail}">`;
    }

    html += `<h3>${data.title}</h3>`;

    html += `
      <button onclick="downloadFile('${data.bestQuality.url}')">
        ⬇ Download Best (${data.bestQuality.quality})
      </button>

      <h4>More Qualities</h4>
    `;

    data.formats.forEach(f => {
      html += `
        <button class="qbtn" onclick="downloadFile('${f.url}')">
          ${f.quality}
        </button>
      `;
    });

    html += `
      <br><br>
      <button onclick="window.open('https://wa.me/?text='+encodeURIComponent('${url}'))">
        Share WhatsApp
      </button>

      <button onclick="window.open('https://t.me/share/url?url='+encodeURIComponent('${url}'))">
        Share Telegram
      </button>
    `;

    msg.innerHTML = html;

  }catch(err){
    msg.innerText = "Server error";
  }
}

function downloadFile(url){

  const a = document.createElement("a");
  a.href = url;
  a.download = "video.mp4";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

}

</script>

</body>
</html>
