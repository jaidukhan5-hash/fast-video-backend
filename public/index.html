<!DOCTYPE html>
<html>
<head>
  <title>Video Downloader</title>
</head>
<body style="font-family:Arial;text-align:center;padding:40px">

<h1>🔥 Video Downloader</h1>

<input id="url" placeholder="Paste Instagram / Pinterest / YouTube URL"
style="padding:10px;width:320px">

<br><br>

<button onclick="download()" style="padding:10px 20px">
Download
</button>

<p id="msg"></p>

<script>
async function download(){
  const url = document.getElementById("url").value;
  const msg = document.getElementById("msg");

  msg.innerText = "Processing...";

  try {
    const res = await fetch("https://fast-video-backend.onrender.com/download", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({url})
    });

    const data = await res.json();

    if(data.success){
      msg.innerText = "Opening video...";
      window.open(data.videoUrl, "_blank");
    } else {
      msg.innerText = data.error;
    }

  } catch(e){
    msg.innerText = "Server error";
  }
}
</script>

</body>
</html>
