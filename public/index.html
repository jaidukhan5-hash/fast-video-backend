<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Video Downloader</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  background:#111827;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:450px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#22c55e);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#msg{
  margin-top:15px;
}

.bad{color:#ef4444;}
.good{color:#22c55e;}

.qualityBtn{
  margin-top:10px;
  padding:10px;
  background:#374151;
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
  width:100%;
}

</style>

</head>

<body>

<div class="card">

  <h1>🚀 Video Downloader</h1>

  <input id="url" placeholder="Paste Instagram / Pinterest / YouTube link">

  <button onclick="downloadVideo()">Get Video</button>

  <div id="msg"></div>

</div>

<script>

async function downloadVideo(){

  const url = document.getElementById("url").value;
  const msg = document.getElementById("msg");

  if(!url){
    msg.innerText = "❌ Enter URL";
    msg.className = "bad";
    return;
  }

  msg.innerText = "⏳ Fetching formats...";
  msg.className = "";

  try{

    const res = await fetch("https://fast-video-backend.onrender.com/download",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if(!data.success){
      msg.innerText = "❌ " + data.error;
      msg.className = "bad";
      return;
    }

    let html = `<h3>Choose Quality</h3>`;

    data.formats.forEach(f => {
      html += `
        <button class="qualityBtn" onclick="downloadFile('${f.url}')">
          ⬇ ${f.quality}
        </button>
      `;
    });

    msg.innerHTML = html;
    msg.className = "good";

  }catch(err){
    msg.innerText = "❌ Server error";
    msg.className = "bad";
  }

}

function downloadFile(fileUrl){

  const a = document.createElement("a");
  a.href = fileUrl;
  a.download = "video.mp4";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

</script>

</body>
</html>
