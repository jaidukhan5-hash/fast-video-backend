<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fast Video Saver</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* SAME CSS (UNCHANGED) */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020817;
color:white;
overflow-x:hidden;
}

/* (FULL CSS SAME AS YOUR CODE — I AM SKIPPING HERE TO SAVE SPACE BUT KEEP IT AS IT IS IN YOUR FILE) */
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
⚡ <span>Fast Video Saver</span>
</div>

<div class="badge">
100% Free • HD Quality • Ultra Fast
</div>

<h1>
Download Videos <span>Instantly</span>
</h1>

<p class="desc">
Fast Video Saver is the premium online video downloader supporting YouTube, Instagram Reels, TikTok videos, Facebook videos, Pinterest videos and Twitter/X downloads — all in one place.
</p>

<div class="inputBox">
<input type="text" id="url" placeholder="Paste video URL here...">
</div>

<button onclick="downloadVideo()">
Download Now
</button>

<div class="loader" id="loader"></div>

<div class="result" id="result">

<img id="thumb" class="thumb">

<div class="videoTitle" id="title"></div>

<div class="downloadLinks" id="links"></div>

</div>

</div>

</div>

<script>

async function downloadVideo(){

const url=document.getElementById('url').value;

if(!url){
alert('Paste URL First');
return;
}

document.getElementById('loader').style.display='block';
document.getElementById('result').style.display='none';

try{

const response=await fetch('/download',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({url})

});

const data=await response.json();

document.getElementById('loader').style.display='none';

if(!data.success){
alert(data.error);
return;
}

document.getElementById('result').style.display='block';

document.getElementById('thumb').src=data.thumbnail;
document.getElementById('title').innerText=data.title;

const links=document.getElementById('links');
links.innerHTML='';


// 🔥 ONLY QUALITY CHANGE DONE HERE

const qualities = [
  { label: "720p", value: "720" },
  { label: "1080p", value: "1080" },
  { label: "2160p", value: "2160" }
];

qualities.forEach(q => {

const format = data.formats.find(f =>
  f.quality.includes(q.value)
);

if(format){

links.innerHTML += `
<a href="${format.url}" target="_blank">
⬇️ ${q.label}
</a>
`;

}

});

}catch(err){
document.getElementById('loader').style.display='none';
alert('Something went wrong');
}

}

</script>

</body>
</html>
